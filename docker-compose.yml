# docker-compose.yml
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"        # host:container
    volumes:
      - sqlite_data:/app/data   # persist the database file
    environment:
      - DATABASE_URL=sqlite:///./data/sql_app.db

  frontend:
    build:
      context: ./frontend-nextjs   # Updated folder path
      dockerfile: Dockerfile
      args:
        # Browser-facing requests hit host port 8000
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"                # Next.js Node server runs on port 3000
    environment:
      # Internal container-to-container requests (for Next.js SSR / Server Components)
      - INTERNAL_BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  sqlite_data: